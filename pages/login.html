<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Benstore</title>
    <!-- CSS Modules -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/pages/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/all.css">
</head>
<body>

    <nav class="navbar scrolled" id="navbar">
        <div class="nav-logo">
            <h2><a href="../index.html">&copy;<span>Ben</span>store</a></h2>
        </div>
        <div class="nav-right">
            <a href="../index.html" style="color: var(--text-muted);"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </nav>

    <section class="auth-section">
        <div class="auth-card">
            <h1>Welcome <span>Back</span></h1>
            <p class="auth-subtitle">Login to access your games and wishlist.</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" required placeholder="you@example.com">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                </div>
                
                <div class="auth-remember">
                    <label>
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary">Sign In</button>
                
                <div class="auth-divider">OR</div>
                
                <button type="button" class="btn-secondary" style="width: 100%; border-radius: var(--radius-full);"><i class="fab fa-google"></i> Sign in with Google</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Sign Up now</a>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="../js/data.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
