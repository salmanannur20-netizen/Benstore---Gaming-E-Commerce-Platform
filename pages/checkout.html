<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Benstore</title>
    <!-- CSS Modules -->
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/pages/checkout.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/all.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar scrolled" id="navbar">
      <div class="nav-logo">
        <h2><a href="../index.html">&copy;<span>Ben</span>store</a></h2>
      </div>
      <div class="nav-right">
        <a href="cart.html" style="color: var(--text-muted)"
          ><i class="fas fa-arrow-left"></i> Back to Cart</a
        >
      </div>
    </nav>

    <header
      class="page-header"
      style="padding-top: 100px; padding-bottom: 30px"
    >
      <h1>Checkout</h1>
    </header>

    <section class="checkout-section">
      <div class="checkout-steps">
        <div class="step completed">
          <div class="step-number"><i class="fas fa-check"></i></div>
          <span>Cart</span>
        </div>
        <div class="step-line active"></div>
        <div class="step active">
          <div class="step-number">2</div>
          <span>Details & Payment</span>
        </div>
        <div class="step-line"></div>
        <div class="step">
          <div class="step-number">3</div>
          <span>Done</span>
        </div>
      </div>

      <div class="checkout-container">
        <div class="checkout-form-area">
          <form id="checkoutForm" class="checkout-form">
            <h2><i class="fas fa-user-circle"></i> Personal Information</h2>
            <div class="form-row">
              <div class="form-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" required placeholder="John" />
              </div>
              <div class="form-group">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" required placeholder="Doe" />
              </div>
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                required
                placeholder="john@example.com"
              />
            </div>

            <h2 style="margin-top: 20px">
              <i class="fas fa-credit-card"></i> Payment Method
            </h2>
            <div class="payment-methods">
              <label class="payment-option selected">
                <input type="radio" name="payment" value="cc" checked />
                <i class="fas fa-credit-card"></i>
                <div class="payment-option-info">
                  <h4>Credit Card</h4>
                  <p>Visa, MasterCard, Amex</p>
                </div>
              </label>
              <label class="payment-option">
                <input type="radio" name="payment" value="paypal" />
                <i class="fab fa-paypal"></i>
                <div class="payment-option-info">
                  <h4>PayPal</h4>
                  <p>Fast and secure checkout</p>
                </div>
              </label>
              <label class="payment-option">
                <input type="radio" name="payment" value="qris" />
                <i class="fas fa-qrcode"></i>
                <div class="payment-option-info">
                  <h4>QRIS</h4>
                  <p>E-Wallet, Mobile Banking (ID Only)</p>
                </div>
              </label>
            </div>

            <div class="form-group" style="margin-top: 30px">
              <button type="submit" class="btn-primary" style="width: 100%">
                Place Order Securely
              </button>
            </div>
          </form>
        </div>

        <div class="order-summary" style="position: sticky; top: 100px">
          <h3>Order Review</h3>
          <div id="checkoutOrderReview">
            <!-- Rendered by JS -->
          </div>
          <div class="summary-row" style="margin-top: 20px">
            <span>Subtotal</span>
            <span id="checkoutSubtotal">Rp 0</span>
          </div>
          <div class="summary-row">
            <span>Tax (11%)</span>
            <span id="checkoutTax">Rp 0</span>
          </div>
          <div class="summary-row total">
            <span>Total Due</span>
            <span id="checkoutTotal">Rp 0</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Success Modal -->
    <div class="modal-overlay" id="checkoutSuccessModal">
      <div class="modal">
        <div class="success-content">
          <i class="fas fa-check-circle"></i>
          <h2>Payment Successful!</h2>
          <p>
            Thank you for your purchase. Your game keys will be sent to your
            email shortly.
          </p>
          <button
            class="btn-primary"
            onclick="window.location.href = '../index.html'"
          >
            Back to Home
          </button>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../js/data.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/checkout.js"></script>
  </body>
</html>
