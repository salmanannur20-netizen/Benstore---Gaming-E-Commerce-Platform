<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store | Benstore</title>
    <!-- CSS Modules -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/pages/store.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/all.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar scrolled" id="navbar">
        <div class="nav-logo">
            <h2><a href="../index.html">&copy;<span>Ben</span>store</a></h2>
        </div>

        <div class="nav-center">
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search premium games...">
            </div>
        </div>

        <div class="nav-right">
            <ul class="nav-links" id="navLinks">
                <li><a href="../index.html"><i class="fas fa-house"></i> Home</a></li>
                <li><a href="store.html"><i class="fas fa-gamepad"></i> Store</a></li>
            </ul>
            <div class="nav-icons">
                <div class="wishlist-icon" onclick="window.location.href='wishlist.html'">
                    <i class="fas fa-heart"></i>
                    <span class="wishlist-badge">0</span>
                </div>
                <div class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge">0</span>
                </div>
                <div class="user-icon" id="userIcon">
                    <i class="fas fa-user"></i>
                    <div class="user-dropdown" id="userDropdown"></div>
                </div>
                <span id="userGreeting" class="user-greeting"></span>
                <div class="menu-toggle" id="mobileMenu">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </nav>

    <!-- Cart Sidebar -->
    <div class="cart-overlay"></div>
    <div class="cart-sidebar">
        <div class="cart-sidebar-header">
            <h3>Your Cart</h3>
            <button class="cart-sidebar-close"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-sidebar-items"></div>
        <div class="cart-sidebar-footer">
            <div class="cart-sidebar-total">
                <span>Subtotal</span>
                <span class="amount">Rp 0</span>
            </div>
            <div class="cart-sidebar-actions">
                <a href="cart.html" class="btn-secondary">View Cart</a>
                <a href="checkout.html" class="btn-primary">Checkout</a>
            </div>
        </div>
    </div>

    <header class="page-header">
        <h1>Store</h1>
        <div class="breadcrumb">
            <a href="../index.html">Home</a> / <span>Store</span>
        </div>
    </header>

    <section class="store-section">
        <div class="store-container">
            <div class="store-toolbar">
                <div class="store-filters" id="filterContainer">
                    <!-- Populated by JS -->
                </div>
                <div class="store-sort">
                    <label for="sortSelect">Sort By:</label>
                    <select id="sortSelect">
                        <option value="newest">Release Date</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Top Rated</option>
                        <option value="name">Name A-Z</option>
                    </select>
                </div>
            </div>
            
            <div class="store-results" id="resultsCount">Showing <span>0</span> games</div>
            
            <div class="store-grid" id="storeGrid">
                <!-- Rendered by store.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Benstore. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="../js/data.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/store.js"></script>
</body>
</html>
